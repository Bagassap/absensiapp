# /etc/nginx/sites-available/guruin
# guruin.smklimpung.id -> Next.js frontend (port 3000)
#
# /uploads/* sekarang diproxy lewat Next.js sendiri (app/api/uploads/[...path])
# supaya bisa attach cookie session, jadi semua traffic cukup diarahkan ke
# frontend port 3000 (lihat frontend/lib/media.ts).

server {
    listen 80;
    listen [::]:80;
    server_name guruin.smklimpung.id;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
